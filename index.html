<!DOCTYPE HTML>
<html>
    <head>
        <title>호텔 무경</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <link rel="stylesheet" href="assets/css/main.css" />
        <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
        
        <style>
            :root {
                --도장-크기: 21%;
                --도장-가로위치: 50%;
                --도장-세로위치: 75%;
                --초대장-빠져나옴: -50%;
                --팝업-가로크기: 1250px; 
                --팝업-최대너비: 95vw; 
                --카피라이트-글씨크기: 0.5rem;
                --카피라이트-글씨색상: #e54343;
                --타이틀-이미지-크기: 80%; 
            }

            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&display=swap');
            
            body, input, select, textarea, h1, h2, h3, h4, h5, h6, p, a {
                font-family: 'Noto Serif KR', serif !important;
            }

            #header .logo { 
                border: none !important; 
                background-image: url('images/봉투_실링.png'); 
                background-size: contain;
                background-position: center;
                background-repeat: no-repeat;
                width: 5.5rem; 
                height: 5.5rem;
            }
            #header .logo .icon { display: none !important; }

            /* 팝업창 및 레이아웃 수정 */
            #main > article {
                background: transparent !important;
                width: var(--팝업-가로크기) !important;
                max-width: var(--팝업-최대너비) !important;
                aspect-ratio: 0.7 / 1 !important; 
                position: relative !important;
                overflow: hidden !important; 
                padding: 4rem 3rem !important;
                box-sizing: border-box !important;
                display: flex !important;
                flex-direction: column !important;
                justify-content: flex-start !important;
                align-items: center !important;
            }

            .article-bg {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                object-fit: fill; 
                z-index: -1;
                pointer-events: none;
            }

            #main > article > *:not(.article-bg) {
                position: relative;
                z-index: 1;
                width: 100%;
            }

            /* 유튜브 영상 컨테이너 */
            .video-wrapper {
                position: relative;
                width: 100%;
                padding-bottom: 56.25%; /* 16:9 비율 */
                margin-bottom: 1rem;
            }
            .video-wrapper iframe {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                border-radius: 4px;
            }

            /* 텍스트 박스 */
            #main > article p {
                background-color: rgba(0, 0, 0, 0.75) !important; 
                padding: 1.2rem !important;
                border-radius: 6px !important;
                color: #ffffff !important;
                font-size: 0.9rem !important;
                overflow-y: auto; 
                max-height: 20vh;
            }

            /* 모바일 최적화 */
            @media screen and (max-width: 736px) {
                #main > article { padding: 2rem 1.5rem !important; aspect-ratio: 0.55 / 1 !important; }
                #main > article p { font-size: 0.7rem !important; max-height: 25vh !important; }
            }

            #main > article#contact { background-color: #000000 !important; aspect-ratio: auto !important; }
            #main > article#contact p { background: none !important; }

            /* 초대장 애니메이션 */
            #envelope-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #321111; z-index: 99999; display: flex; justify-content: center; align-items: center; transition: opacity 1.5s ease; }
            #envelope-overlay.hidden { opacity: 0; visibility: hidden; }
            .envelope-container { position: relative; width: 85vw; max-width: 600px; cursor: pointer; }
            .env-letter { position: absolute; bottom: 2%; left: 5%; width: 90% !important; z-index: 2; transition: 1.5s; }
            .envelope-container.open .env-letter { transform: translateY(-50%); }
        </style>
    </head>
    <body>
        <!-- (이하 생략 - 오버레이 및 구조는 동일) -->
        <div id="wrapper">
            <!-- ... (헤더 생략) ... -->
            <div id="main">
                <article id="worldview">
                    <img src="images/초대장배경.png" alt="" class="article-bg" />
                    <h2 class="major"><img src="images/월드뷰.png" alt="Worldview" /></h2>
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/ISFYp_wNXnA" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <p><strong>무경(無境): 경계가 지워진 공간</strong><br /><br />
                    강렬한 욕망, 지독한 죄책감, 혹은 끔찍한 진실과 연관된 자들에게만 전송되는 초대장입니다. 평범한 현대인이었던 플레이어 역시 이 초대장을 열어보는 순간, 인과율의 늪에 빠져 1930년대 경성의 호텔로 강제 소환됩니다.</p>
                </article>
                <!-- ... (나머지 생략) ... -->
            </div>
        </div>
        <!-- (스크립트 동일) -->
    </body>
</html>
