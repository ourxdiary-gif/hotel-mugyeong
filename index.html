<!DOCTYPE HTML>
<html>
    <head>
        <title>호텔 무경</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <link rel="stylesheet" href="assets/css/main.css" />
        <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
        
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&display=swap');
            body { font-family: 'Noto Serif KR', serif !important; }

            /* 팝업창(초대장) 배경 설정 */
            #main > article {
                background-image: url('images/초대장배경.png') !important;
                background-size: 100% 100% !important;
                background-position: center !important;
                background-repeat: no-repeat !important;
                width: 900px !important;
                max-width: 95vw !important;
                padding: 3rem 2rem !important;
                box-sizing: border-box !important;
                margin: 0 auto !important;
            }

            /* 유튜브 영상 반응형 박스 */
            .video-wrapper {
                position: relative;
                width: 100%;
                padding-bottom: 56.25%; /* 16:9 */
                margin-bottom: 1rem;
                background: #000;
            }
            .video-wrapper iframe {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
            }

            /* 텍스트 박스 */
            #main > article p {
                background-color: rgba(0, 0, 0, 0.75) !important;
                padding: 1rem !important;
                border-radius: 6px !important;
                color: #ffffff !important;
                font-size: 0.9rem !important;
            }

            /* 강조 문구 */
            strong.highlight-title { font-size: 1.2rem !important; font-weight: 700 !important; }
        </style>
    </head>
    <body class="is-preload">
        <div id="wrapper">
            <div id="main">
                <!-- 모든 영상에 동일한 유튜브 링크 적용 -->
                <article id="trailer">
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/ISFYp_wNXnA" frameborder="0" allowfullscreen></iframe>
                    </div>
                </article>

                <article id="worldview">
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/ISFYp_wNXnA" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <p><strong class="highlight-title">무경(無境): 경계가 지워진 공간</strong><br /><br />
                    강렬한 욕망, 지독한 죄책감, 혹은 끔찍한 진실과 연관된 자들에게만 전송되는 초대장입니다.</p>
                </article>

                <article id="character">
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/ISFYp_wNXnA" frameborder="0" allowfullscreen></iframe>
                    </div>
                </article>
            </div>
        </div>

        <script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/main.js"></script>
    </body>
</html>
