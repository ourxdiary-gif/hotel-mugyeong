<!DOCTYPE HTML>
<html>
    <head>
        <title>호텔 무경</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <link rel="stylesheet" href="assets/css/main.css" />
        <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
        
        <style>
            :root {
                --도장-크기: 21%;
                --도장-가로위치: 50%;
                --도장-세로위치: 75%;
                --초대장-빠져나옴: -50%;
                --팝업-가로크기: 1250px; 
                --팝업-최대너비: 98vw; 
                --카피라이트-글씨색상: #e54343;
            }

            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&display=swap');
            
            body, input, select, textarea, h1, h2, h3, h4, h5, h6, p, a {
                font-family: 'Noto Serif KR', serif !important;
            }

            /* 헤더 로고 */
            #header .logo { 
                border: none !important; 
                background-image: url('images/봉투_실링.png'); 
                background-size: contain;
                width: 5.5rem; height: 5.5rem;
            }
            #header .logo .icon { display: none !important; }

            /* 팝업창(초대장) 구조: 센터 정렬 및 여백 강제 제거 */
            #main > article {
                background-image: url('images/초대장배경.png') !important;
                background-size: 100% 100% !important;
                width: var(--팝업-가로크기) !important;
                max-width: var(--팝업-최대너비) !important;
                padding: 4rem 3rem !important;
                box-sizing: border-box !important;
                margin: 0 auto !important; /* 위아래 여백 최소화 */
            }

            /* 유튜브 영상 컨테이너 */
            .video-wrapper {
                position: relative;
                width: 100%;
                padding-bottom: 56.25%;
                margin-bottom: 1rem;
            }
            .video-wrapper iframe {
                position: absolute;
                top: 0; left: 0;
                width: 100%; height: 100%;
                border-radius: 4px;
            }

            /* 텍스트 박스 */
            #main > article p {
                background-color: rgba(0, 0, 0, 0.75) !important; 
                padding: 1.2rem !important;
                border-radius: 6px !important;
                color: #ffffff !important;
                font-size: 0.9rem !important;
                overflow-y: auto; 
                max-height: 20vh;
            }

            /* 모바일 최적화 (여백 최소화) */
            @media screen and (max-width: 736px) {
                #main > article { padding: 1.5rem 1rem !important; }
                #main > article p { font-size: 0.75rem !important; max-height: 25vh !important; }
            }

            /* 초대장 애니메이션 */
            #envelope-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #321111; z-index: 99999; display: flex; justify-content: center; align-items: center; }
            .envelope-container { position: relative; width: 85vw; max-width: 600px; cursor: pointer; }
            .env-letter { position: absolute; bottom: 2%; left: 5%; width: 90% !important; transition: 1.5s; }
            .envelope-container.open .env-letter { transform: translateY(-50%); }
        </style>
    </head>
    <body class="is-preload">

        <div id="envelope-overlay">
            <div class="envelope-container" id="envelope">
                <img src="images/봉투_뒤.png" />
                <img src="images/초대장.png" class="env-letter" id="clickable-letter"/>
                <img src="images/봉투_앞.png" />
            </div>
        </div>

        <div id="wrapper">
            <div id="main">
                <!-- TRAILER -->
                <article id="trailer">
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/ISFYp_wNXnA" frameborder="0" allowfullscreen></iframe>
                    </div>
                </article>

                <!-- WORLDVIEW -->
                <article id="worldview">
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/ISFYp_wNXnA" frameborder="0" allowfullscreen></iframe>
                    </div>
                    <p><strong>무경(無境): 경계가 지워진 공간</strong><br /><br />
                    강렬한 욕망, 지독한 죄책감, 혹은 끔찍한 진실과 연관된 자들에게만 전송되는 초대장입니다.</p>
                </article>

                <!-- CHARACTER -->
                <article id="character">
                    <div class="video-wrapper">
                        <iframe src="https://www.youtube.com/embed/ISFYp_wNXnA" frameborder="0" allowfullscreen></iframe>
                    </div>
                </article>

                <!-- CONTACT -->
                <article id="contact">
                    <form method="post" action="#">
                        <!-- ... 폼 내용 ... -->
                    </form>
                </article>
            </div>
        </div>

        <script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/main.js"></script>
    </body>
</html>
