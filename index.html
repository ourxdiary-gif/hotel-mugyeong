<html>
    <head>
        <title>호텔 무경</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
        <link rel="stylesheet" href="assets/css/main.css" />
        <noscript><link rel="stylesheet" href="assets/css/noscript.css" /></noscript>
        
        <style>
            /* 
            ======================================================================
            [👇 초보자를 위한 설정창 👇]
            ======================================================================
            */
            :root {
                /* --- 봉투 애니메이션 설정 --- */
                --도장-크기: 21%;
                --도장-가로위치: 50%;
                --도장-세로위치: 75%;
                --초대장-빠져나옴: -50%;

                /* --- 💡 팝업창(내부 페이지) 설정 --- */
                --팝업-가로크기: 800px; 
                --팝업-최대너비: 90vw; 
                
                /* --- 💡 카피라이트 설정 --- */
                --카피라이트-글씨크기: 0.5rem;
                --카피라이트-글씨색상: #e54343;

                /* 👇 타이틀 이미지 크기 👇 */
                --타이틀-이미지-크기: 90%; 
            }

            @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;700&display=swap');
            
            body, input, select, textarea, h1, h2, h3, h4, h5, h6, p, a {
                font-family: 'Noto Serif KR', serif !important;
            }

            /* 다이아몬드 대신 실링 이미지 교체 */
            #header .logo { 
                border: none !important; 
                background-image: url('images/봉투_실링.png'); 
                background-size: contain;
                background-position: center;
                background-repeat: no-repeat;
                width: 5.5rem; 
                height: 5.5rem;
            }
            #header .logo .icon { display: none !important; }

            /* 선 색상 변경 */
            #header .content { border-color: #e54343 !important; }
            #header nav ul { border-color: #e54343 !important; }
            #header nav ul li { 
                border-color: #e54343 !important; 
                border-left: solid 1px #e54343 !important; 
            }
            #header nav ul li:first-child { border-left: none !important; }
            #header .content:before { background-color: #e54343 !important; }
            #header nav:before, #header nav:after { display: none !important; }
            #header h1, #header p, #header nav ul li a { color: #e54343 !important; }

            /* ====================================================================== */
            /* 팝업창 크기 및 배경 이미지 설정 */
            /* ====================================================================== */
            #main > article {
                background-color: transparent !important;
                background-image: url('images/초대장배경.png') !important;
                background-size: 100% 100% !important; 
                background-position: center !important;
                background-repeat: no-repeat !important;
                
                width: var(--팝업-가로크기) !important;
                max-width: var(--팝업-최대너비) !important;
                
                padding: 6rem 6rem 6rem 6rem !important; 
            }

            /* 모바일 화면 여백 설정 */
            @media screen and (max-width: 736px) {
                #main > article {
                    padding: 4rem 3rem 4rem 3rem !important;
                }
            }
            
            #main > article h2.major {
                border-bottom: none !important; 
                text-align: center !important; 
                margin-bottom: 2rem;
                width: 100% !important; 
                padding: 0 !important;
            }

            #main > article h2.major img {
                display: block;
                margin: 0 auto !important; 
                width: var(--타이틀-이미지-크기) !important; 
                max-width: 100% !important; 
                height: auto;
            }

            /* ====================================================================== */
            /* 💡 CONTACT 페이지만 단색 배경으로 변경 (초대장 이미지 제거) */
            /* ====================================================================== */
            #main > article#contact {
                background-image: none !important;
                background-color: #000000 !important; /* 검정색 단색 배경 */
            }

            /* ====================================================================== */
            /* 비디오 영역 및 푸터 */
            /* ====================================================================== */
            .image.main { margin: 0 0 2rem 0 !important; padding: 0 !important; }
            .image.main video { width: 100%; border-radius: 4px; display: block; }
            #footer .copyright { color: var(--카피라이트-글씨색상) !important; font-size: var(--카피라이트-글씨크기) !important; }
            #footer .copyright a { color: var(--카피라이트-글씨색상) !important; }

            /* 초대장 애니메이션 */
            #envelope-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background-color: #321111; z-index: 99999; display: flex; justify-content: center; align-items: center; transition: opacity 1.5s ease, visibility 1.5s ease; }
            #envelope-overlay.hidden { opacity: 0; visibility: hidden; pointer-events: none;}
            .envelope-container { position: relative; width: 85vw; max-width: 600px; cursor: pointer; perspective: 2000px; }
            .envelope-container img { display: block; width: 100%; height: auto; }
            .env-base { position: relative; z-index: 1; }
            .env-letter { position: absolute; bottom: 2%; left: 5%; width: 90% !important; z-index: 2; transition: transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1); }
            .env-front { position: absolute; bottom: 0; left: 0; z-index: 3; pointer-events: none;}
            .env-flap-wrapper { position: absolute; top: 0; left: 0; width: 100%; z-index: 4; transform-origin: top center; transition: transform 1.2s cubic-bezier(0.4, 0, 0.2, 1); transform-style: preserve-3d; pointer-events: none; }
            .flap-front { position: relative; backface-visibility: hidden; }
            .flap-back { position: absolute; top: 0; left: 0; backface-visibility: hidden; transform: rotateX(180deg); }
            .env-seal { position: absolute; top: var(--도장-세로위치); left: var(--도장-가로위치); transform: translate(-50%, -50%); width: var(--도장-크기) !important; z-index: 5; transition: opacity 0.5s ease, transform 0.5s ease; pointer-events: none; }
            .envelope-container.open .env-flap-wrapper { transform: rotateX(180deg); }
            .envelope-container.open .env-seal { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
            .envelope-container.pull-out .env-letter { transform: translateY(var(--초대장-빠져나옴)); cursor: pointer;} 
            .envelope-container.pull-out .env-flap-wrapper { z-index: 1; }
        </style>
    </head>
    <body class="is-preload">

        <div id="envelope-overlay">
            <div class="envelope-container" id="envelope">
                <img src="images/봉투_뒤.png" class="env-base" />
                <img src="images/초대장.png" class="env-letter" id="clickable-letter"/>
                <img src="images/봉투_앞.png" class="env-front" />
                <div class="env-flap-wrapper" id="flap">
                    <img src="images/봉투_뚜껑앞면.png" class="flap-front" />
                    <img src="images/봉투_뚜껑뒷면.png" class="flap-back" />
                </div>
                <img src="images/봉투_실링.png" class="env-seal" />
            </div>
        </div>

        <div id="wrapper">
            <header id="header">
                <div class="logo"></div>
                <div class="content">
                    <div class="inner">
                        <h1>HOTEL MUGYEONG</h1>
                        <p>귀하를 호텔 무경의 특별한 손님으로 초대합니다<br />
                        이곳에는 시간의 경계도, 삶과 죽음의 경계도, 진실과 거짓의 경계도 존재하지 않습니다</p>
                    </div>
                </div>
                <nav>
                    <ul>
                        <li><a href="#trailer">TRAILER</a></li>
                        <li><a href="#worldview">WORLDVIEW</a></li>
                        <li><a href="#character">CHARACTER</a></li>
                        <li><a href="#contact">CONTACT</a></li>
                    </ul>
                </nav>
            </header>

            <div id="main">
                <article id="trailer">
                    <h2 class="major"><img src="images/트레일러.png" alt="Trailer" /></h2>
                    <span class="image main"><img src="images/pic01.jpg" alt="" /></span>
                    <p></p>
                </article>

                <article id="worldview">
                    <h2 class="major"><img src="images/월드뷰.png" alt="Worldview" /></h2>
                    <span class="image main">
                        <iframe
                            src="https://www.youtube.com/embed/fX-h8SGp0jY"
                            title="호텔 무경 Trailer"
                            frameborder="0"
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                            allowfullscreen
                            style="width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 4px; display: block;">
                        </iframe>
                    </span>
                    <p></p>
                </article>

                <article id="character">
                    <h2 class="major"><img src="images/캐릭터.png" alt="Character" /></h2>
                    <span class="image main"><img src="images/pic03.jpg" alt="" /></span>
                    <p></p>
                </article>

                <article id="contact">
                    <h2 class="major"><img src="images/콘택트.png" alt="Contact" /></h2>
                    <form method="post" action="#">
                        <div class="fields">
                            <div class="field half">
                                <label for="name">Name</label>
                                <input type="text" name="name" id="name" />
                            </div>
                            <div class="field half">
                                <label for="email">Email</label>
                                <input type="text" name="email" id="email" />
                            </div>
                            <div class="field">
                                <label for="message">Message</label>
                                <textarea name="message" id="message" rows="4"></textarea>
                            </div>
                        </div>
                        <ul class="actions">
                            <li><input type="submit" value="Send Message" class="primary" /></li>
                            <li><input type="reset" value="Reset" /></li>
                        </ul>
                    </form>
                </article>
            </div>

            <footer id="footer">
                <p class="copyright">&copy; HOTEL MUGYEONG. All rights reserved.</p>
            </footer>
        </div>

        <div id="bg"></div>

        <script src="assets/js/jquery.min.js"></script>
        <script src="assets/js/browser.min.js"></script>
        <script src="assets/js/breakpoints.min.js"></script>
        <script src="assets/js/util.js"></script>
        <script src="assets/js/main.js"></script>
        
        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const envelope = document.getElementById('envelope');
                const overlay = document.getElementById('envelope-overlay');
                const clickableLetter = document.getElementById('clickable-letter');
                
                let isHoldingPreload = true;

                const observer = new MutationObserver(function(mutations) {
                    mutations.forEach(function(mutation) {
                        if (isHoldingPreload && !document.body.classList.contains('is-preload')) {
                            document.body.classList.add('is-preload');
                        }
                    });
                });
                observer.observe(document.body, { attributes: true, attributeFilter: ['class'] });

                let isLetterClickable = false;

                envelope.addEventListener('click', function(e) {
                    if(envelope.classList.contains('open')) return;

                    envelope.classList.add('open'); 
                    setTimeout(() => { envelope.classList.add('pull-out'); }, 800); 
                    
                    setTimeout(() => { isLetterClickable = true; }, 1500);
                });

                clickableLetter.addEventListener('click', function(e) {
                    if(!isLetterClickable) return;
                    e.stopPropagation(); 

                    overlay.classList.add('hidden'); 
                    
                    setTimeout(() => {
                        isHoldingPreload = false;
                        document.body.classList.remove('is-preload');
                    }, 300); 
                    
                    setTimeout(() => { overlay.style.display = 'none'; }, 1500);
                });
            });
        </script>

    </body>
</html>
